spring.application.name=biblioteca

# --- Base de datos -------------------------------------------------------------------
# H2 en archivo para no requerir instalación. En producción: PostgreSQL/MySQL vía variables
# de entorno (SPRING_DATASOURCE_URL, ...) y migraciones versionadas con Flyway en vez de ddl-auto.
spring.datasource.url=jdbc:h2:file:./data/biblioteca;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
# Sin sesión abierta durante la vista: obliga a resolver las consultas dentro del servicio.
spring.jpa.open-in-view=false
# Inserciones/actualizaciones agrupadas y carga de relaciones perezosas por lotes (mitiga N+1).
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# --- Servidor ------------------------------------------------------------------------
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB
# No exponer trazas ni mensajes internos en errores no controlados.
server.error.include-stacktrace=never
server.error.include-message=never

# --- Observabilidad ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Reglas de negocio (ver LibraryProperties) ---------------------------------------
library.loans.days=14
library.loans.max-active=3
# Un préstamo solo se puede renovar cuando faltan N días o menos para su vencimiento.
library.loans.renewal-window-days=5

# --- CORS ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Documentación de la API (springdoc) ------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
