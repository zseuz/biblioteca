# Este archivo REEMPLAZA al de main en los tests, así que se repiten los ajustes que
# cambian el comportamiento (open-in-view, reglas) para probar lo mismo que en producción.
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
library.loans.days=14
library.loans.max-active=3
app.cors.allowed-origins=http://localhost:4200
